# Copy this file to app/.streamlit/secrets.toml (git-ignored) and fill in your own values.
# On Streamlit Community Cloud paste the same content in: App settings -> Secrets.
# Every key is optional: without them the app runs, but the related feature is disabled.

# Virtual agent "Sophie" (LLM via Groq) -> https://console.groq.com/keys
GROQ_API_KEY = ""

# Booking notifications via Telegram bot (@BotFather)
telegram_bot_token = ""
DEMO_TELEGRAM_CHAT_ID = ""

# Optional persistence of bookings in Google Sheets
USE_GOOGLE_SHEETS = false
GOOGLE_SHEETS_SPREADSHEET_ID = ""

[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = ""
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
